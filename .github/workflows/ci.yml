# Validates the standalone TypeScript client package.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build packages
        run: pnpm run build
      - name: Assert no language is claimed as supported
        run: node scripts/assert-no-supported-language.mjs
